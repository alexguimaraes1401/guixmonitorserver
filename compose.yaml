services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    container_name: mediamtx-local
    restart: unless-stopped
    volumes:
      - "./mediamtx.yml:/mediamtx.yml:ro"
    ports:
      - "127.0.0.1:8554:8554/tcp"
      - "127.0.0.1:1935:1935/tcp"
      - "${HLS_BIND_IP:-127.0.0.1}:${HLS_HOST_PORT:-8888}:8888/tcp"
  jt808:
    build: .
    container_name: jt808-local
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      JT808_PORT: "7611"
      JT808_AUTH_CODE: "${JT808_AUTH_CODE:-local-test-auth}"
      JT808_HOST_PORT: "${JT808_HOST_PORT:-6608}"
      DASHBOARD_PORT: "8080"
      JT1078_PORT: "1078"
      JT1078_PUBLIC_PORT: "${JT1078_PUBLIC_PORT:-1078}"
      JT1078_PUBLIC_IP: "${JT1078_PUBLIC_IP:-201.66.73.13}"
      JT1078_RTSP_BASE_URL: "rtsp://mediamtx:8554"
      RTSP_MEDIA_ENABLED: "true"
      RTSP_TIMESTAMP_MODE: "${RTSP_TIMESTAMP_MODE:-transport}"
      RTSP_TIMESTAMP_SCALE_MS_PER_UNIT: "${RTSP_TIMESTAMP_SCALE_MS_PER_UNIT:-1}"
      RTSP_SYNC_MODE: "${RTSP_SYNC_MODE:-bounded-sync}"
      RTSP_SYNC_TOLERANCE_MS: "${RTSP_SYNC_TOLERANCE_MS:-250}"
      RTSP_SYNC_HOLD_TIMEOUT_MS: "${RTSP_SYNC_HOLD_TIMEOUT_MS:-250}"
      RTSP_SYNC_MAX_SCHEDULE_AHEAD_MS: "${RTSP_SYNC_MAX_SCHEDULE_AHEAD_MS:-750}"
      VIDEO_AUTO_RECOVERY_ENABLED: "${VIDEO_AUTO_RECOVERY_ENABLED:-true}"
      RTSP_JITTER_BUFFER_MS: "${RTSP_JITTER_BUFFER_MS:-250}"
      RTSP_GOP_DROP_QUEUE_BYTES: "${RTSP_GOP_DROP_QUEUE_BYTES:-262144}"
      RTSP_AUDIO_ARRIVAL_TIMEOUT_MS: "${RTSP_AUDIO_ARRIVAL_TIMEOUT_MS:-8000}"
      JT1078_CHANNEL_1_STREAM_TYPE: "${JT1078_CHANNEL_1_STREAM_TYPE:-0}"
      JT1078_CHANNEL_1_FORCE_AUDIO: "${JT1078_CHANNEL_1_FORCE_AUDIO:-false}"
      JT1078_CHANNEL_2_STREAM_TYPE: "${JT1078_CHANNEL_2_STREAM_TYPE:-0}"
      JT1078_SOCKET_IDLE_TIMEOUT_MS: "${JT1078_SOCKET_IDLE_TIMEOUT_MS:-20000}"
      JT1078_RECONNECT_GRACE_MS: "${JT1078_RECONNECT_GRACE_MS:-30000}"
      OBS_WEBSOCKET_URL: "${OBS_WEBSOCKET_URL:-}"
      OBS_WEBSOCKET_PASSWORD: "${OBS_WEBSOCKET_PASSWORD:-}"
    ports:
      - "${JT808_BIND_IP:-0.0.0.0}:${JT808_HOST_PORT:-6608}:7611/tcp"
      - "${JT1078_BIND_IP:-0.0.0.0}:${JT1078_PUBLIC_PORT:-1078}:1078/tcp"
      - "${DASHBOARD_BIND_IP:-0.0.0.0}:${DASHBOARD_HOST_PORT:-18081}:8080/tcp"
